name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Find Android project and build APK
        shell: bash
        run: |
          SETTINGS_FILE="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle was not uploaded."
            echo "Upload the extracted Android project files, including settings.gradle, build.gradle, and the app folder."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "Android project found at: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          gradle testDebugUnitTest assembleDebug

      - name: Save finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Javad-File-Processor-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
